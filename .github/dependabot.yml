version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /apps/chordsmith-web
      - /apps/pocket-dj
      - /apps/pocket-daw
      - /packages/pocket-audio-core
      - /packages/pcs-format
    schedule:
      interval: monthly
      time: "06:10"
      timezone: Australia/Sydney
    open-pull-requests-limit: 2
    labels: [dependencies]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-runtime-routine:
        applies-to: version-updates
        dependency-type: production
        patterns: ["*"]
        update-types: [minor, patch]
      npm-dev-routine:
        applies-to: version-updates
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/pocket-daw/src-tauri
    schedule:
      interval: monthly
      time: "06:20"
      timezone: Australia/Sydney
    open-pull-requests-limit: 1
    labels: [dependencies]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
      cargo-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:30"
      timezone: Australia/Sydney
    open-pull-requests-limit: 1
    labels: [dependencies]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
